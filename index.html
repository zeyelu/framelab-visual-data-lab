function bars(rows,col,value,interactive=false){if(!rows.length)return`<div class="empty">${L('没有可展示的数据','No data to display')}</div>`;const rs=rows.slice(0,12),valid=rs.map(r=>E.number(r[value])).filter(v=>v!==null),lo=Math.min(0,...valid),hi=Math.max(0,...valid)||1,scale=v=>130+(v-lo)/(hi-lo||1)*350,zero=scale(0);let c='';rs.forEach((r,i)=>{const v=E.number(r[value]),xx=v===null?zero:scale(v);c+=txt(120,29+i*29,String(r[col]??L('缺失','Missing')).slice(0,18),'end')+`<rect x="${Math.min(zero,xx)}" y="${16+i*29}" width="${Math.max(1,Math.abs(xx-zero))}" height="18" rx="2" fill="${v<0?'#c59362':'#5d9c8b'}" ${interactive?`tabindex="0" role="button" data-action="category" data-col="${esc(col)}" data-value="${esc(r[col]??'')}" aria-label="${esc(r[col])}"`:''}><title>${esc(r[col])}: ${fmt(v)}</title></rect>`+txt(Math.max(zero,xx)+8,29+i*29,fmt(v),'start','value')});c+=`<line x1="${zero}" x2="${zero}" y1="10" y2="${rs.length*29+5}" stroke="#cdd9dc"/>`;return svg(c,label(col)+' / '+value,rs.length*29+20)}
function overview(){const prof=E.profile(data,columns),missing=prof.reduce((s,c)=>s+c.missing,0),cells=data.length*columns.length,dups=E.duplicates(data,columns),corr=E.corr(data,x,y);return`<div class="metrics">${metric(L('记录数','Records'),fmt(data.length,0),L('当前分析范围','Current analysis scope'),'↗')}${metric(L('字段数','Columns'),columns.length,`${numeric().length} ${L('个数值字段','numeric columns')}`,'▦')}${metric(L('数据完整度','Completeness'),cells?fmt((1-missing/cells)*100,1)+'%':'—',`${missing} ${L('个缺失单元格','missing cells')}`,'◇')}${metric(L('重复记录','Duplicate rows'),dups,L('全字段一致 · 保留首条之外的记录','Exact matches beyond the first occurrence'),'⧉')}</div><div class="grid"><section class="card">${head(L('变量关系','Variable relationships'),L('散点图 · 颜色表示分组','Scatter plot · color encodes groups'),`<span class="tag green">r = ${fmt(corr.r)}</span>`)}<div class="card-body"><div class="form-line"><label>X <select id="axis-x">${options(numeric(),x)}</select></label><label>Y <select id="axis-y">${options(numeric(),y)}</select></label><label>${L('分组','Color')} <select id="axis-group">${options(columns,groupcol)}</select></label></div>${scatter()}</div></section><section class="card">${head(L('数值分布','Value distribution'),L('点击柱形，筛选该数值区间','Click a bar to filter its range'),`<select id="axis-dist" aria-label="${L('分布字段','Distribution column')}">${options(numeric(),dist)}</select>`)}<div class="card-body">${histogram(data,dist)}<div class="insight"><strong>${L('中位数','Median')} ${fmt(E.stats(data.map(r=>r[dist])).median)}</strong> · ${L('标准差','Std deviation')} ${fmt(E.stats(data.map(r=>r[dist])).std)}<br>${L('12 个等宽区间；缺失值不参与分布统计。','12 equal-width bins; missing values are excluded.')}</div></div></section></div><div class="grid equal"><section class="card">${head(L('字段完整度','Column completeness'),L('长度表示非缺失比例','Length encodes the non-missing proportion'))}<div class="card-body">${prof.slice(0,12).map(c=>`<div class="quality-row"><span title="${esc(c.key)}">${esc(label(c.key))}</span><div class="track ${c.missing?'warn':''}"><i style="width:${data.length?(1-c.missing/data.length)*100:0}%"></i></div><b>${data.length?fmt((1-c.missing/data.length)*100,0)+'%':'—'}</b></div>`).join('')}<p class="chart-note">${L('橙色提示存在缺失值。完整度不代表测量准确性。','Amber indicates missing values. Completeness does not imply measurement accuracy.')}</p></div></section><section class="card">${head(L('分组规模','Group sizes'),L('前 12 类 · 点击条形筛选类别','Top 12 categories · click a bar to filter'),`<span class="tag">${esc(label(groupcol))}</span>`)}<div class="card-body">${bars(E.group(data,[groupcol],groupcol,'size').sort((a,b)=>b[groupcol+'_size']-a[groupcol+'_size']),groupcol,groupcol+'_size',true)}</div></section></div><section class="card">${head(L('数据快照','Data snapshot'),L('前 8 条记录 · 进入数据表查看全部','First 8 records · open the data table for all records'),`<button data-view="table">${L('查看数据表','Open table')} →</button>`)}<div style="height:15px"></div>${dataTable(data.slice(0,8),columns)}</section>`}
function dataTable(rows,keys,sortable=false){return`<div class="table-wrap"><table><thead><tr><th>#</th>${keys.map(k=>`<th>${sortable?`<button data-action="sortcolumn" data-col="${esc(k)}" title="${L('升序排列，可撤销','Sort ascending, reversible')}">${esc(label(k))} ↕</button>`:esc(label(k))}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td style="color:#9aa6ad">${i+1}</td>${keys.map(k=>`<td title="${esc(r[k]??'')}">${E.missing(r[k])?`<span class="null">NA</span>`:typeof r[k]==='number'?fmt(r[k],4):esc(r[k])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${keys.length+1}" class="empty">${L('当前没有记录，请撤销筛选或导入其他数据。','No records. Undo the filter or import another dataset.')}</td></tr>`}</tbody></table></div>`}
function tableView(){const rows=data.filter(r=>!search||columns.some(k=>String(r[k]??'').toLowerCase().includes(search.toLowerCase()))),pages=Math.max(1,Math.ceil(rows.length/30));page=Math.min(page,pages-1);return`<section class="card">${head(L('数据浏览器','Data browser'),L('搜索仅影响此表，不改变分析数据。点击列标题按升序排序。','Search affects this table only. Click a column header to sort ascending.'),`<input class="search" id="search" placeholder="${L('搜索单元格…','Search cells…')}" value="${esc(search)}" aria-label="${L('搜索数据','Search data')}">`)}<div style="height:15px"></div>${dataTable(rows.slice(page*30,page*30+30),columns,true)}<div class="pager"><span>${fmt(rows.length,0)} ${L('条记录','records')} · ${L('每页 30 条','30 per page')}</span><div><button data-action="prev" ${page===0?'disabled':''}>←</button> ${page+1} / ${pages} <button data-action="next" ${page+1>=pages?'disabled':''}>→</button></div></div></section><h2 style="font-size:15px;margin-top:26px">${L('字段画像','Column profiles')} <small class="sub">describe() · dtypes · nunique()</small></h2><div class="profile-grid">${E.profile(data,columns).map(c=>`<article class="profile-card"><h3><span class="type">${c.type==='number'?'#':c.type==='date'?'◷':'Aa'}</span>${esc(label(c.key))}</h3><span class="tag">${L({number:'数值',date:'日期',string:'文本'}[c.type],c.type)}</span><dl><dt>${L('缺失','Missing')}</dt><dd>${c.missing}</dd><dt>${L('唯一值','Unique')}</dt><dd>${c.unique}</dd>${c.type==='number'?[['均值','Mean','mean'],['标准差','Std dev','std'],['最小值','Min','min'],['25%','25%','q1'],['中位数','Median','median'],['75%','75%','q3'],['最大值','Max','max']].map(([zh,en,k])=>`<dt>${L(zh,en)}</dt><dd>${fmt(c[k])}</dd>`).join(''):`<dt>${L('最常见','Top value')}</dt><dd>${esc(String(c.values[0]?.[0]??'—').slice(0,15))}</dd>`}</dl></article>`).join('')}</div>`}
function placeholder(){return`<div class="card placeholder"><div class="glyph">⤇</div><h3>${L('先看变化，再做决定','See the change before committing')}</h3><p>${L('在左侧设定参数并预览。结果不会覆盖当前数据，直到你选择“应用结果”。','Configure an operation and preview it. Your data stays unchanged until you apply the result.')}</p><span class="tag">${L('支持撤销与重做','UNDO & REDO SUPPORTED')}</span></div>`}
function resultPanel(){if(!pending)return placeholder();const a=E.profile(data,columns).reduce((s,c)=>s+c.missing,0),b=E.profile(pending.rows,pending.columns).reduce((s,c)=>s+c.missing,0);return`<section class="card"><div class="preview-bar"><div><b>${L('结果预览','Result preview')}</b><small>${data.length} → ${pending.rows.length} ${L('行','rows')} · ${columns.length} → ${pending.columns.length} ${L('列','columns')} · ${L('缺失单元格','Missing cells')} ${a} → ${b}</small></div><button class="primary" data-action="apply">${L('应用结果','Apply result')}</button></div>${pending.chart||''}${dataTable(pending.rows.slice(0,15),pending.columns)}<div class="pager">${L('预览前 15 行；应用和导出使用完整结果。','First 15 rows shown; apply and export use the complete result.')}</div></section>`}
function cleanView(){return`<div class="panel-grid"><section class="card config"><h3>${L('清洗操作','Cleaning operation')}</h3>${choices('clean-kind',L('操作类型','Operation'),[['filter','条件筛选','Filter rows'],['fill','填补缺失值','Fill missing'],['dropna','删除缺失行','Drop missing rows'],['dedup','删除重复记录','Drop duplicates'],['outliers','剔除 IQR 异常值','Remove IQR outliers'],['sort','排序','Sort rows']],'filter')}<div id="clean-fields">${cleanFields('filter')}</div><button class="primary" data-action="preview-clean">${L('预览变化','Preview changes')} →</button><p class="help">${L('多个条件可逐步应用，等价于 AND 筛选。所有操作针对当前数据；撤销可恢复上一状态。','Apply conditions sequentially for AND filtering. Operations use the current dataset; undo restores the previous state.')}</p></section><div class="stack" id="result">${resultPanel()}<section class="card">${head(L('用图形发现清洗目标','Find cleaning targets visually'),L('直方图显示分布；可在概览中点击区间筛选。','The histogram reveals the distribution; click ranges in Overview to filter.'))}<div class="card-body">${histogram(data,dist,false)}</div></section></div></div>`}
function cleanFields(kind){let s=select('op-col',L('字段','Column'),kind==='outliers'?numeric():columns,kind==='outliers'?dist:columns[0],kind==='dropna');if(kind==='filter')s+=choices('op-filter',L('条件','Condition'),[['eq','等于','Equals'],['ne','不等于','Not equal'],['gt','大于','Greater than'],['ge','大于等于','At least'],['lt','小于','Less than'],['le','小于等于','At most'],['contains','包含文本','Contains text'],['starts','开头匹配','Starts with'],['missing','为空','Is missing'],['present','非空','Is present']],'gt')+`<label for="op-value">${L('比较值','Comparison value')}</label><input id="op-value" placeholder="${L('为空与非空时无需填写','Not needed for missing/present')}">`;if(kind==='fill')s+=choices('fill-method',L('填补方法','Method'),[['mean','均值','Mean'],['median','中位数','Median'],['constant','指定值','Constant'],['ffill','向前填充','Forward fill']],'mean')+`<label for="op-value">${L('指定值模式的值','Value for constant mode')}</label><input id="op-value" value="0">`;if(kind==='dedup')s=`<p class="help">${L('比较选定字段，保留每组首条记录。','Compare selected columns and keep the first occurrence.')}</p>${checks('dedup-key',columns,columns)}`;if(kind==='outliers')s+=`<p class="help">${L('保留 [Q1 − 1.5×IQR, Q3 + 1.5×IQR] 内的记录。缺失值保留；异常值不一定是错误。','Keep values in [Q1 − 1.5×IQR, Q3 + 1.5×IQR]. Missing values stay; an outlier is not necessarily an error.')}</p>`;if(kind==='sort')s+=choices('sort-direction',L('排序方向','Order'),[['asc','升序','Ascending'],['desc','降序','Descending']],'asc');return s}
function checks(name,keys,selected=[]){return`<div class="check-list">${keys.map(k=>`<label><input type="checkbox" name="${name}" value="${esc(k)}" ${selected.includes(k)?'checked':''}>${esc(label(k))}</label>`).join('')}</div>`}
function transformView(){return`<div class="panel-grid"><section class="card config"><h3>${L('字段转换','Column transformation')}</h3>${choices('transform-kind',L('操作类型','Operation'),[['derive','计算新字段','Derive a column'],['cast','转换数据类型','Convert type'],['rename','重命名字段','Rename column'],['select','选择保留字段','Select columns'],['melt','宽表转长表','Unpivot / melt']],'derive')}<div id="transform-fields">${transformFields('derive')}</div><button class="primary" data-action="preview-transform">${L('预览转换','Preview transformation')} →</button><p class="help">${L('除零、非法数值和无法识别的日期产生缺失值。日期需为 ISO 格式 YYYY-MM-DD。','Division by zero, invalid numbers and unrecognized dates produce missing values. Dates require ISO YYYY-MM-DD format.')}</p></section><div id="result">${resultPanel()}</div></div>`}
function transformFields(kind){if(kind==='select')return checks('select-key',columns,columns);if(kind==='melt')return`<p class="help">${L('选中标识列，其余字段展开为 variable 与 value。','Select identifier columns. Other fields become variable and value.')}</p>${checks('melt-key',columns,[columns[0]])}`;let s=select('op-col',L('输入字段','Input column'),columns,numeric()[0]||columns[0]);if(kind==='cast')return s+choices('cast-type',L('目标类型','Target type'),[['number','数值','Number'],['string','文本','Text'],['date','日期','Date']],'number');s+=`<label for="new-name">${L('新字段名','New column name')}</label><input id="new-name" value="${kind==='derive'?'derived_value':'renamed_column'}">`;if(kind==='derive')s+=choices('derive-fn',L('计算方法','Function'),[['add','加法','Add'],['subtract','减法','Subtract'],['multiply','乘法','Multiply'],['divide','除法','Divide'],['log','自然对数','Natural logarithm'],['zscore','Z 分数标准化','Z-score standardization'],['trim','去除首尾空格','Trim whitespace'],['lower','转为小写','Lowercase'],['upper','转为大写','Uppercase'],['year','提取年份','Extract year'],['month','提取年月','Extract year-month']],'divide')+`<label for="derive-other">${L('第二个字段或常数','Second column or constant')}</label><select id="derive-other"><option value="">${L('使用常数','Use a constant')}</option>${options(numeric(),'')}</select><label for="op-value">${L('常数值','Constant')}</label><input id="op-value" type="number" value="100"><p class="help">${L('第二个输入仅用于加减乘除。Z 分数采用样本标准差 ddof=1。','The second input is only used for arithmetic. Z-scores use sample standard deviation, ddof=1.')}</p>`;return s}
function analyzeView(){return`<div class="tabs">${[['group','分组统计','Group by'],['pivot','透视分析','Pivot table'],['corr','相关矩阵','Correlation'],['time','时间序列','Time series']].map(([k,a,b])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${L(a,b)}</button>`).join('')}</div>${tab==='corr'?correlationView():`<div class="panel-grid"><section class="card config">${analyzeFields()}<button class="primary" data-action="preview-analyze">${L('运行分析','Run analysis')} →</button><p class="help">${L('统计使用全部当前记录。数值统计忽略缺失值；标准差采用 ddof=1；分组保留缺失键。','Statistics use all current rows. Numeric metrics ignore missing values; std uses ddof=1; groups retain null keys.')}</p></section><div id="result">${resultPanel()}</div></div>`}`}
function analyzeFields(){if(tab==='group')return`<h3>groupby().agg()</h3><label>${L('分组键 可多选','Group keys · multiple allowed')}</label>${checks('group-key',columns,[groupcol])}${select('op-col',L('统计字段','Value column'),columns,y)}${choices('agg',L('聚合方法','Aggregation'),aggItems,'mean')}`;if(tab==='pivot')return`<h3>pivot_table()</h3>${select('pivot-row',L('行维度','Row dimension'),columns,groupcol)}${select('pivot-column',L('列维度','Column dimension'),columns,categories().find(k=>k!==groupcol)||columns[1])}${select('op-col',L('数值字段','Value column'),numeric(),y)}${choices('agg',L('聚合方法','Aggregation'),aggItems,'mean')}`;return`<h3>resample() · rolling()</h3>${select('op-col',L('日期字段','Date column'),columns,E.profile(data,columns).find(c=>c.type==='date')?.key||columns[0])}${select('time-value',L('数值字段','Value column'),numeric(),y)}${choices('time-unit',L('时间粒度','Frequency'),[['day','日','Day'],['month','月','Month'],['year','年','Year']],'month')}${choices('agg',L('聚合方法','Aggregation'),aggItems,'mean')}<label for="rolling">${L('移动平均窗口','Rolling mean window')}</label><input id="rolling" type="number" value="3" min="1" max="100"><p class="help">${L('窗口按已观测时间组计算；不补齐无记录的日期，前 k−1 组留空。','Windows count observed periods only; absent dates are not inserted. The first k−1 groups are null.')}</p>`}
function correlationView(){const ns=numeric().slice(0,10);if(ns.length<2)return placeholder();return`<div class="card">${head(L('Pearson 相关矩阵','Pearson correlation matrix'),L('点击单元格，将变量对带入概览散点图。最多显示前 10 个数值字段。','Click a cell to inspect the pair in Overview. Up to the first 10 numeric columns are shown.'))}<div class="card-body"><div class="matrix" style="grid-template-columns:100px repeat(${ns.length},minmax(60px,1fr))"><span></span>${ns.map(k=>`<span class="m-label" title="${esc(label(k))}">${esc(label(k))}</span>`).join('')}${ns.map(a=>`<span class="m-label" title="${esc(label(a))}">${esc(label(a))}</span>`+ns.map(b=>{const c=E.corr(data,a,b),alpha=c.r===null?0:Math.abs(c.r)*.75;return`<button class="cell" data-action="corr" data-x="${esc(a)}" data-y="${esc(b)}" style="background:${c.r>=0?'rgba(29,111,98,':'rgba(174,110,59,'}${alpha});color:${alpha>.45?'white':'#36534f'}" title="n=${c.n}" aria-label="${esc(label(a)+' × '+label(b))}; r=${fmt(c.r)}; n=${c.n}">${fmt(c.r)}</button>`}).join('')).join('')}</div><div class="legend"><span><i style="background:#ae6e3b"></i>−1</span><span><i style="background:#edf2f0"></i>0</span><span><i style="background:#1d6f62"></i>+1</span></div><p class="chart-note">${L('逐对剔除缺失值；悬停可查看有效样本量。常数列或不足两对观测显示 —。相关不等于因果。','Pairwise complete observations; hover for sample size. Constant columns or fewer than two pairs show —. Correlation does not imply causation.')}</p></div></div>`}
function joinView(){return`<div class="panel-grid"><section class="card config"><h3>${L('连接配置','Join configuration')}</h3><p class="help">${L('右表可单独导入。默认右表为 6 个批次的模拟供应商信息。','Import a separate right table. The default is synthetic supplier information for 6 batches.')}</p><button data-action="import-right">＋ ${L('导入右表','Import right table')}</button>${select('join-left',L('左表连接键','Left key'),columns,columns.includes('batch')?'batch':columns[0])}${select('join-right',L('右表连接键','Right key'),E.cols(right),E.cols(right).includes('batch')?'batch':E.cols(right)[0])}${choices('join-how',L('连接方式','Join type'),[['left','左连接','Left join'],['inner','内连接','Inner join'],['outer','全外连接','Full outer join'],['right','右连接','Right join']],'left')}<button class="primary" data-action="preview-join">${L('预览连接','Preview join')} →</button><p class="help">${L('键按类型精确匹配。重复键产生多对多组合；缺失键会互相匹配，与 pandas.merge 类似。右表同名字段加 _right 后缀。','Keys match exactly by type. Duplicate keys create many-to-many combinations; null keys match each other as in pandas.merge. Overlapping right columns receive _right.')}</p></section><div class="stack"><section class="card">${head(L('连接结构','Join structure'),L('当前数据与右侧数据集','Current dataset and right-side dataset'))}<div class="flow"><div class="flow-node"><b>${fmt(data.length,0)}</b><small>${L('左表','Left table')}</small></div><span>⋈</span><div class="flow-node"><b>${fmt(right.length,0)}</b><small>${L('右表','Right table')}</small></div><span>→</span><div class="flow-node"><b>${pending?.op.kind==='join'?fmt(pending.rows.length,0):'?'}</b><small>${L('结果','Result')}</small></div></div>${dataTable(right.slice(0,5),E.cols(right))}</section><div id="result">${resultPanel()}</div></div></div>`}
function opName(op){const names={filter:['条件筛选','Filter rows'],range:['图形区域筛选','Visual range filter'],sort:['排序','Sort rows'],dropna:['删除缺失行','Drop missing rows'],dedup:['删除重复记录','Drop duplicates'],fill:['填补缺失值','Fill missing'],outliers:['IQR 异常值筛选','IQR outlier filter'],cast:['转换类型','Convert type'],rename:['重命名字段','Rename column'],select:['选择字段','Select columns'],derive:['派生新字段','Derive column'],group:['分组聚合','Group aggregation'],pivot:['透视表','Pivot table'],melt:['宽表转长表','Unpivot / melt'],timeseries:['时间聚合与移动平均','Time aggregation & rolling mean'],join:['多表连接','Join tables']};return L(...(names[op.kind]||[op.kind,op.kind]))}
function historyView(){return`<div class="grid equal"><section class="card">${head(L('分析步骤','Analysis steps'),L('仅记录已应用操作，按顺序执行','Applied operations only, in execution order'))}<div class="history-item"><span class="step">0</span><div><b>${L('载入数据','Load data')}</b><p>${initial.length} ${L('行','rows')} · ${esc(sourceName==='demo'?L('内置模拟数据','Built-in synthetic data'):sourceName)}</p></div></div>${history.map((h,i)=>`<div class="history-item"><span class="step">${i+1}</span><div><b>${opName(h.op)}</b><p>${h.before.rows.length} → ${h.after.rows.length} ${L('行','rows')} · ${h.before.columns.length} → ${h.after.columns.length} ${L('列','columns')}</p><code>${esc(h.op.col||h.op.keys?.join(', ')||h.op.lk||'')}</code></div></div>`).join('')}<div class="card-body"><button data-action="undo" ${history.length?'':'disabled'}>↶ ${L('撤销最后一步','Undo last step')}</button> <button data-action="save-session">${L('保存工作空间','Save workspace')}</button><p class="help">${L('工作空间包含导入数据、右表和操作记录，便于下次恢复。普通 CSV/JSON 导出仅包含当前结果。','A workspace includes imported data, the right table and operation history. CSV/JSON exports contain only the current result.')}</p></div></section><section class="card">${head(L('对应的 pandas 代码','Equivalent pandas code'),L('导出包含原始数据的独立 Python 脚本','Export a standalone Python script with embedded source data'),`<button data-action="python">${L('导出 .py','Export .py')}</button>`)}<div class="card-body"><pre class="code">${esc(pythonCode(false))}</pre><p class="help">${L('浏览器采用 JavaScript 实现常用表格操作；不运行完整 pandas。导出脚本使用 pandas 与 NumPy，已注明空值、日期和窗口约定。','The browser implements common tabular operations in JavaScript, not the full pandas runtime. Exported scripts use pandas and NumPy with explicit null, date and window conventions.')}</p></div></section></div>`}
function setPending(op,result){const res=result||E.apply(data,op,columns);pending={...res,op};if(op.kind==='group')pending.chart=`<div class="card-body">${bars(res.rows,op.keys[0],`${op.col}_${op.agg}`)}<p class="chart-note">${L('预览前 12 组，完整结果见导出。','First 12 groups charted; export contains all groups.')}</p></div>`;if(op.kind==='pivot')pending.chart=pivotChart(res);if(op.kind==='timeseries')pending.chart=lineChart(res);$('#result').innerHTML=resultPanel();toast(L('预览已更新，尚未改变当前数据。','Preview updated. Current data is unchanged.'))}

function pivotChart(res){const keys=res.columns.slice(1),rs=res.rows.slice(0,12),vals=rs.flatMap(r=>keys.map(k=>E.number(r[k]))).filter(v=>v!==null),max=Math.max(1,...vals.map(Math.abs));return`<div class="card-body"><div class="matrix" style="grid-template-columns:100px repeat(${keys.length},minmax(55px,1fr))"><span></span>${keys.map(k=>`<span class="m-label" title="${esc(k)}">${esc(k.replace('value: ',''))}</span>`).join('')}${rs.map(r=>`<span class="m-label">${esc(r[res.columns[0]]??'NA')}</span>`+keys.map(k=>{const v=E.number(r[k]),alpha=v===null?0:Math.abs(v)/max*.75;return`<span class="cell" style="background:${v<0?'rgba(174,110,59,':'rgba(29,111,98,'}${alpha});color:${alpha>.45?'white':'#36534f'}">${fmt(v)}</span>`}).join('')).join('')}</div><p class="chart-note">${L('颜色深浅表示绝对值大小，橙色表示负值；显示前 12 行。','Color intensity encodes magnitude; amber marks negatives. First 12 rows shown.')}</p></div>`}
function lineChart(res){const rs=res.rows,keys=res.columns;if(!rs.length)return'';const vals=rs.flatMap(r=>[r[keys[1]],r.rolling_mean]).filter(E.num).map(Number);if(!vals.length)return'';const[lo,hi]=extent(vals),xx=i=>50+i/Math.max(1,rs.length-1)*450,yy=v=>215-(v-lo)/(hi-lo)*175;let c='';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4;c+=`<line class="tick" x1="50" x2="510" y1="${yy(v)}" y2="${yy(v)}"/>`+txt(43,yy(v)+4,fmt(v),'end')}[keys[1],'rolling_mean'].forEach((k,j)=>{let path='',started=false;rs.forEach((r,i)=>{if(!E.num(r[k])){started=false;return}path+=`${started?'L':'M'}${xx(i)},${yy(r[k])} `;started=true});c+=`<path d="${path}" fill="none" stroke="${j?'#be8a55':'#267f72'}" stroke-width="2" ${j?'stroke-dasharray="5 4"':''}/>`});rs.forEach((r,i)=>{if(i%Math.max(1,Math.ceil(rs.length/5))===0)c+=txt(xx(i),240,r.period,'middle')});return`<div class="card-body">${svg(c,L('时间聚合与移动平均','Time aggregate and rolling mean'))}<div class="legend"><span><i style="background:#267f72"></i>${L('聚合值','Aggregate')}</span><span><i style="background:#be8a55"></i>${L('移动平均','Rolling mean')}</span></div></div>`}

function importDialog(target='main'){importTarget=target;importRows=null;dialog(target==='right'?L('导入右侧数据表','Import right table'):L('导入你的数据','Import your data'),`<div class="dropzone" id="dropzone"><span style="font-size:26px;color:var(--green)">⇧</span><h3>${L('将文件拖到这里','Drop a file here')}</h3><p>CSV · TSV · JSON | ${L('最大 5 MB · 20,000 行 · 80 列','Up to 5 MB · 20,000 rows · 80 columns')}</p><button class="primary" data-action="choose-file">${L('选择本地文件','Choose local file')}</button></div><div class="field-grid"><div class="field">${choices('delimiter',L('分隔符','Delimiter'),[['auto','自动判断','Auto detect'],[',','逗号','Comma'],['tab','制表符','Tab'],[';','分号','Semicolon']],'auto')}</div><div class="field">${choices('encoding',L('文件编码','File encoding'),[['utf-8','UTF-8','UTF-8'],['gb18030','GB18030 / GBK','GB18030 / GBK']],'utf-8')}</div></div><p class="help">${L('首行为列名；空单元格视为缺失。字符串 NA、null 不会自动转为空。日期保留 ISO 文本，带前导零的编码保留为文本。','The first row contains headers; empty cells are missing. Literal NA/null strings stay intact. ISO dates remain text; leading-zero identifiers stay text.')}</p><details><summary>${L('或粘贴 CSV / JSON 数据','Or paste CSV / JSON data')}</summary><textarea id="paste-data" placeholder="sample,value\nA,12\nB,18" aria-label="${L('粘贴数据','Paste data')}"></textarea><button data-action="parse-paste">${L('解析并预览','Parse and preview')}</button></details><div id="import-preview"></div><div class="dialog-actions">${target==='main'?`<button data-action="demo">${L('载入默认模拟数据','Load synthetic demo')}</button>`:''}<button class="primary" id="confirm-import" data-action="confirm-import" disabled>${L('确认导入','Confirm import')}</button></div><p class="help">${L('导入主表将开始新的分析流程。请先导出现有结果或工作空间。文件在本地解析，不发送到服务器。','Importing a main table starts a new workflow. Export existing results or workspace first. Files are parsed locally, never sent to a server.')}</p>`);const zone=$('#dropzone');zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag')};zone.ondragleave=()=>zone.classList.remove('drag');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])}}
function parseInput(text,name='pasted.csv'){
 if(text.length>5*1024*1024)throw Error('limit');let parsed;if(name.endsWith('.json')||/^[\s\uFEFF]*[\[{]/.test(text)){parsed=JSON.parse(text.replace(/^\uFEFF/,''));if(parsed?.format==='framelab-workspace-v1'){if(importTarget!=='main')throw Error('jsonShape');const src=E.normalize(parsed.initial),rightData=E.normalize(parsed.right);if(!Array.isArray(parsed.operations)||parsed.operations.length>100)throw Error('limit');const allowed=['filter','range','sort','dropna','dedup','fill','outliers','cast','rename','select','derive','group','pivot','melt','timeseries','join'];let state={rows:src,columns:E.cols(src)},hs=[];for(const op of parsed.operations){if(!allowed.includes(op.kind))throw Error('jsonShape');const after=op.kind==='join'?E.merge(state.rows,E.normalize(op.right),op.lk,op.rk,op.how):E.apply(state.rows,op,state.columns);hs.push({op,before:state,after});state=after}return{rows:state.rows,columns:state.columns,name:parsed.name||'workspace',workspace:{initial:src,right:rightData,history:hs}}}}
 else {let sep=$('#delimiter')?.value||'auto';if(sep==='auto'){const line=text.split(/\r?\n/)[0];sep=name.endsWith('.tsv')||line.includes('\t')?'\t':line.split(';').length>line.split(',').length?';':','}if(sep==='tab')sep='\t';parsed=E.parseCSV(text,sep)}const rows=E.normalize(parsed);return{rows,columns:E.cols(rows),name}}

async function readFile(file){try{if(file.size>5*1024*1024)throw Error('limit');const buffer=await file.arrayBuffer(),text=new TextDecoder($('#encoding').value,{fatal:true}).decode(buffer);previewImport(parseInput(text,file.name))}catch(e){importRows=null;$('#confirm-import').disabled=true;$('#import-preview').innerHTML=`<p class="error">${esc(errs[e.message]?L(...errs[e.message]):L('读取失败，请检查文件格式或编码。','Could not read the file. Check format and encoding.'))}</p>`}}

const py=v=>JSON.stringify(v),pyList=a=>'['+a.map(py).join(', ')+']';
function pythonCode(embed=true){let lines=['# FrameLab — reproducible analysis','import json','import pandas as pd','import numpy as np',''];if(embed)lines.push('df = pd.DataFrame(json.loads('+py(JSON.stringify(initial))+'))');else lines.push('df = pd.read_csv("source.csv")  # export embeds source data');lines.push('df = df.replace({"": None})','');
 history.forEach((h,i)=>{const o=h.op,c=`df[${py(o.col)}]`,n=`df[${py(o.name)}]`,keys=pyList(o.keys||[]);lines.push(`# ${i+1}. ${o.kind}`);switch(o.kind){
 case'filter':{let q='';if(o.op==='missing')q=`${c}.isna()`;else if(o.op==='present')q=`${c}.notna()`;else if(o.op==='contains'||o.op==='starts')q=o.op==='contains'?`${c}.astype("string").str.contains(${py(o.value)}, case=False, regex=False, na=False)`:`${c}.astype("string").str.startswith(${py(o.value)}, na=False)`;else{const numeric=E.profile(h.before.rows,h.before.columns).find(p=>p.key===o.col)?.type==='number',v=numeric&&E.num(o.value)?Number(o.value):py(o.value),col=numeric?c:`${c}.astype("string")`;q=`${c}.notna() & (${col} ${{eq:'==',ne:'!=',gt:'>',ge:'>=',lt:'<',le:'<='}[o.op]} ${v})`}lines.push(`df = df.loc[${q}].copy()`);break}
 case'range':lines.push(`df = df.loc[pd.to_numeric(${c}, errors="coerce").between(${o.min}, ${o.max})${o.y?` & pd.to_numeric(df[${py(o.y)}], errors="coerce").between(${o.ymin}, ${o.ymax})`:''}].copy()`);break;
 case'sort':lines.push(`df = df.sort_values(${py(o.col)}, ascending=${o.direction==='asc'?'True':'False'}, na_position="last", kind="stable")`);break;
 case'dropna':lines.push(`df = df.dropna(${o.col?'subset=['+py(o.col)+']':''})`);break;
 case'dedup':lines.push(`df = df.drop_duplicates(subset=${keys}, keep="first")`);break;
 case'fill':{let val=o.method==='mean'||o.method==='median'?`pd.to_numeric(${c}, errors="coerce").${o.method}()`:E.profile(h.before.rows,h.before.columns).find(p=>p.key===o.col)?.type==='number'&&E.num(o.value)?Number(o.value):py(o.value);lines.push(`${c} = ${o.method==='ffill'?`${c}.ffill()`:`${c}.fillna(${val})`}`);break}
 case'outliers':lines.push(`q1, q3 = pd.to_numeric(${c}, errors="coerce").quantile([0.25, 0.75])`,`iqr = q3 - q1`,`df = df.loc[${c}.isna() | ${c}.between(q1 - 1.5*iqr, q3 + 1.5*iqr)].copy()`);break;
 case'cast':lines.push(`${c} = ${o.type==='number'?`pd.to_numeric(${c}, errors="coerce")`:o.type==='date'?`pd.to_datetime(${c}, errors="coerce", utc=True).dt.strftime("%Y-%m-%d")`:`${c}.astype("string")`}`);break;
 case'rename':lines.push(`df = df.rename(columns={${py(o.col)}: ${py(o.name)}})`);break;
 case'select':lines.push(`df = df[${keys}].copy()`);break;
 case'derive':{const a=`pd.to_numeric(${c}, errors="coerce")`,b=o.other?`pd.to_numeric(df[${py(o.other)}], errors="coerce")`:Number(o.value),f=o.fn;let expr=f==='trim'?`${c}.astype("string").str.strip()`:f==='lower'||f==='upper'?`${c}.astype("string").str.${f}()`:f==='year'||f==='month'?`${c}.astype("string").str.slice(0, ${f==='year'?4:7}).where(pd.to_datetime(${c}, errors="coerce").notna())`:f==='log'?`np.log(${a}.where(${a} > 0))`:f==='zscore'?`(${a} - ${a}.mean()) / ${a}.std(ddof=1)`:`${a} ${{add:'+',subtract:'-',multiply:'*',divide:'/'}[f]} ${b}`;lines.push(`${n} = ${expr}`);if(['add','subtract','multiply','divide','log','zscore'].includes(f))lines.push(`${n} = ${n}.replace([np.inf, -np.inf], np.nan)`);break}
 case'group':if(!['count','size','nunique'].includes(o.agg))lines.push(`${c} = pd.to_numeric(${c}, errors="coerce")`);lines.push(`df = df.groupby(${keys}, dropna=False, sort=False)[${py(o.col)}].agg(${py(o.agg)}).reset_index(name=${py(o.col+'_'+o.agg)})`);break;
 case'pivot':if(!['count','size','nunique'].includes(o.agg))lines.push(`${c} = pd.to_numeric(${c}, errors="coerce")`);lines.push(`df[${py(o.column)}] = df[${py(o.column)}].fillna("(missing)").astype(str)`,`df = df.groupby([${py(o.row)}, ${py(o.column)}], dropna=False, sort=False)[${py(o.col)}].agg(${py(o.agg)}).unstack(${py(o.column)}${["sum","count","size","nunique"].includes(o.agg)?", fill_value=0":""})`,`df = df.reindex(sorted(df.columns), axis=1)`,`df.columns = ["value: " + str(k) for k in df.columns]`,`df = df.reset_index()`);break;
 case'melt':lines.push(`df = df.assign(_row_order=np.arange(len(df))).melt(id_vars=${keys} + ["_row_order"], var_name="variable", value_name="value")`,`df = df.sort_values("_row_order", kind="stable").drop(columns="_row_order")`);break;
 case'timeseries':if(!['count','size','nunique'].includes(o.agg))lines.push(`df[${py(o.valueCol)}] = pd.to_numeric(df[${py(o.valueCol)}], errors="coerce")`);lines.push(`df = df.loc[pd.to_datetime(${c}, errors="coerce").notna()].copy()`,`df["period"] = df[${py(o.col)}].astype(str).str.slice(0, ${o.unit==='year'?4:o.unit==='month'?7:10})`,`df = df.groupby("period", sort=True)[${py(o.valueCol)}].agg(${py(o.agg)}).reset_index(name=${py(o.valueCol+'_'+o.agg)})`,`df["rolling_mean"] = df[${py(o.valueCol+'_'+o.agg)}].rolling(${o.window}, min_periods=1).mean()`,`df.loc[df.index[:${o.window - 1}], "rolling_mean"] = np.nan`);break;
 case'join':lines.push(embed?'right = pd.DataFrame(json.loads('+py(JSON.stringify(o.right))+'))':'right = pd.read_csv("right.csv")',`right.columns = [c + "_right" if c in df.columns else c for c in right.columns]`,`df = df.merge(right, left_on=${py(o.lk)}, right_on=${py(h.before.columns.includes(o.rk)?o.rk+'_right':o.rk)}, how=${py(o.how)}, sort=False)`);break;
 }lines.push('df = df.reset_index(drop=True)','')});lines.push('df.to_csv("framelab_result.csv", index=False, encoding="utf-8-sig")','print(df)');return lines.join('\n')}
function bindBrush(){const el=$('#scatter');if(!el)return;let start=null,rect=null;const pos=e=>{const p=el.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const a=p.matrixTransform(el.getScreenCTM().inverse());return{x:Math.max(55,Math.min(515,a.x)),y:Math.max(35,Math.min(215,a.y))}};el.onpointerdown=e=>{if(e.button!==0)return;start=pos(e);el.setPointerCapture(e.pointerId);el.querySelector('.selection')?.remove();rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.classList.add('selection');rect.setAttribute('pointer-events','none');el.append(rect)};el.onpointermove=e=>{if(!start)return;const p=pos(e);for(const[k,v]of Object.entries({x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),width:Math.abs(p.x-start.x),height:Math.abs(p.y-start.y)}))rect.setAttribute(k,v)};el.onpointerup=e=>{if(!start)return;const p=pos(e),s=start;start=null;if(Math.abs(s.x-p.x)<5||Math.abs(s.y-p.y)<5){rect.remove();return}const xx=v=>+el.dataset.x0+(v-55)/460*(el.dataset.x1-el.dataset.x0),yy=v=>+el.dataset.y0+(215-v)/180*(el.dataset.y1-el.dataset.y0);selection={kind:'range',col:x,min:xx(Math.min(s.x,p.x)),max:xx(Math.max(s.x,p.x)),y,ymin:yy(Math.max(s.y,p.y)),ymax:yy(Math.min(s.y,p.y))};const count=E.apply(data,selection,columns).rows.length;$('#brush-action').innerHTML=`<button class="primary" data-action="apply-brush" style="margin-top:12px">${L('保留框选的','Keep selected')} ${count} ${L('行','rows')}</button>`};el.onpointercancel=()=>{start=null;rect?.remove()}}
document.addEventListener('change',e=>{try{const id=e.target.id;if(pending && e.target.closest('.config')){pending=null;if(document.querySelector('#result'))document.querySelector('#result').innerHTML=placeholder()}if(id==='clean-kind'){$('#clean-fields').innerHTML=cleanFields(e.target.value);pending=null;$('#result').innerHTML=placeholder()}if(id==='transform-kind'){$('#transform-fields').innerHTML=transformFields(e.target.value);pending=null;$('#result').innerHTML=placeholder()}if(id==='axis-x'){x=e.target.value;render()}if(id==='axis-y'){y=e.target.value;render()}if(id==='axis-group'){groupcol=e.target.value;render()}if(id==='axis-dist'){dist=e.target.value;render()}if(id==='file'&&e.target.files[0]){readFile(e.target.files[0]);e.target.value=''}if(id==='search'){search=e.target.value;page=0;render()}}catch(err){fail(err)}});
const val=id=>$('#'+id)?.value||'',checked=name=>$$(`input[name="${name}"]:checked`).map(e=>e.value);
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-action]');if(!b)return;try{
 if(b.dataset.view){view=b.dataset.view;pending=null;render();return}if(b.dataset.tab){tab=b.dataset.tab;pending=null;render();return}
 switch(b.dataset.action){
 case'language':lang=lang==='zh'?'en':'zh';localStorage.setItem('framelab-language',lang);$('#dialog').close();pending=null;render();break;
 case'guide':guide();break;case'close':$('#dialog').close();break;case'import':importDialog();break;case'import-right':importDialog('right');break;case'choose-file':$('#file').click();break;
 case'parse-paste':previewImport(parseInput(val('paste-data')));break;
 case'confirm-import':if(importRows){if(importTarget==='right'){right=importRows.rows;pending=null;render()}else load(importRows);$('#dialog').close();toast(L('数据已导入。','Data imported.'))}break;
 case'demo':load({rows:E.demo(),columns:E.cols(E.demo()),name:'demo'});$('#dialog').close();break;
 case'export':exportDialog();break;case'csv':download('framelab_result.csv',E.csv(data,columns),'text/csv;charset=utf-8');break;case'json':download('framelab_result.json',JSON.stringify(data,null,2),'application/json');break;
 case'python':download('framelab_analysis.py',pythonCode());break;
 case'save-session':download('framelab_workspace.json',JSON.stringify({format:'framelab-workspace-v1',name:sourceName,initial,right,operations:history.map(h=>h.op)}),'application/json');break;
 case'svg-export':{const chart=$('#content svg');if(!chart){toast(L('当前页面没有 SVG 图表，请先进入概览。','No SVG chart on this page. Open Overview first.'));break}const copy=chart.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='text{font:11px Arial,sans-serif;fill:#667b85}.tick{stroke:#e3e9ec;stroke-width:1}.value{fill:#244b43}';copy.prepend(style);download('framelab_chart.svg',new XMLSerializer().serializeToString(copy),'image/svg+xml');break}
 case'undo':{const h=history.pop();if(h){future.push(h);data=h.before.rows;columns=h.before.columns;pending=null;render()}break}
 case'redo':{const h=future.pop();if(h){history.push(h);data=h.after.rows;columns=h.after.columns;pending=null;render()}break}
 case'reset':{dialog(L('恢复导入时的数据','Restore the imported dataset'),`<p>${L('这会清除当前操作流程。需要保留分析时，请先导出工作空间。','This clears the current workflow. Export your workspace first if you want to preserve it.')}</p><div class="dialog-actions"><button data-action="close">${L('取消','Cancel')}</button><button class="primary" data-action="confirm-reset">${L('恢复','Restore')}</button></div>`);break}
 case'confirm-reset':data=structuredClone(initial);columns=E.cols(data);history=[];future=[];pending=null;$('#dialog').close();render();break;
 case'prev':page--;render();break;case'next':page++;render();break;
 case'sortcolumn':commit({kind:'sort',col:b.dataset.col,direction:'asc'});break;
 case'bin':commit({kind:'range',col:b.dataset.col,min:+b.dataset.min,max:+b.dataset.max});break;
 case'category':commit({kind:'filter',col:b.dataset.col,op:b.dataset.value===''?'missing':'eq',value:b.dataset.value});break;
 case'apply-brush':if(selection)commit(selection);selection=null;break;
 case'corr':x=b.dataset.x;y=b.dataset.y;view='overview';render();break;
 case'preview-clean':{let kind=val('clean-kind'),op={kind,col:val('op-col')};if(kind==='filter'){op.op=val('op-filter');op.value=val('op-value')}if(kind==='fill'){op.method=val('fill-method');op.value=val('op-value')}if(kind==='dedup'){op.keys=checked('dedup-key');if(!op.keys.length)throw Error('oneColumn')}if(kind==='sort')op.direction=val('sort-direction');setPending(op);break}
 case'preview-transform':{let kind=val('transform-kind'),op={kind,col:val('op-col')};if(kind==='derive'){op.name=val('new-name');op.fn=val('derive-fn');op.other=val('derive-other');op.value=val('op-value')}if(kind==='rename')op.name=val('new-name');if(kind==='cast')op.type=val('cast-type');if(kind==='select')op.keys=checked('select-key');if(kind==='melt')op.keys=checked('melt-key');setPending(op);break}
 case'preview-analyze':{let op={kind:tab==='time'?'timeseries':tab,col:val('op-col'),agg:val('agg')};if(tab==='group'){op.keys=checked('group-key');if(!op.keys.length)throw Error('oneColumn');if(op.keys.includes(op.col+'_'+op.agg))throw Error('nameExists')}if(tab==='pivot'){op.row=val('pivot-row');op.column=val('pivot-column');if(op.row===op.column){toast(L('行维度与列维度请选择不同字段。','Choose different row and column dimensions.'));break}}if(tab==='time'){op.valueCol=val('time-value');op.unit=val('time-unit');op.window=Math.max(1,Math.min(100,Math.floor(+val('rolling')||3)))}setPending(op);break}
 case'preview-join':{const op={kind:'join',lk:val('join-left'),rk:val('join-right'),how:val('join-how'),right:structuredClone(right)};setPending(op,E.merge(data,right,op.lk,op.rk,op.how));break}
 case'apply':if(pending){const p=pending;commit(p.op,p)}break;
 }
 }catch(err){fail(err)}});
document.addEventListener('keydown',e=>{if(e.target.matches('svg [data-action]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('beforeunload',e=>{if(history.length){e.preventDefault();e.returnValue=''}});
render();
